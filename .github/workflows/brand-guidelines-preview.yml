name: Brand Guidelines Preview CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/brand-guidelines/**'
      - '.github/workflows/brand-guidelines-preview.yml'
  push:
    branches:
      - 'staging/brand-guidelines-preview-artifact'
      - 'staging/brand-guidelines-lockfile-ci'
      - 'staging/import-code-zip-brand-guidelines'
    paths:
      - 'apps/brand-guidelines/**'
      - '.github/workflows/brand-guidelines-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-guidelines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brand-guidelines
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Restore and verify lockfile
        run: npm run restore-lockfile
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Smoke-check build output
        run: |
          test -s dist/index.html
          grep -q './assets/' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
      - name: Upload isolated Preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-guidelines-preview-${{ github.sha }}
          path: apps/brand-guidelines/dist/
          if-no-files-found: error
          retention-days: 7
