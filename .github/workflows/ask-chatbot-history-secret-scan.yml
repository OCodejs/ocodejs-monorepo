name: Ask Chatbot Source History Secret Scan

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ask-chatbot-history-secret-scan.yml"
      - "governance/migrations/ASK-CHATBOT-GIT-NATIVE-IMPORT-GATE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ask-chatbot-history-secret-scan
  cancel-in-progress: true

jobs:
  scan-source-history:
    name: Scan all source branches and tags (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install pinned Gitleaks version
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Fetch complete source Git history
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/OCodejs/ask-chatbot.git /tmp/ask-chatbot.git
          git clone /tmp/ask-chatbot.git /tmp/ask-chatbot-scan
          git -C /tmp/ask-chatbot-scan fetch --all --tags --prune

      - name: Scan all refs and publish metadata-only report
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/gitleaks-redacted.json
          set +e
          gitleaks git /tmp/ask-chatbot-scan --redact=100 --report-format json --report-path "$report" --log-opts="--all" --exit-code 1
          scan_status=$?
          set -e
          if [ ! -s "$report" ]; then
            echo "Gitleaks did not produce a report; refusing to classify the scan." >&2
            exit 2
          fi
          # Emit metadata only. Never print Secret, Match, or Raw fields.
          jq 'map({rule_id: .RuleID, file: .File, commit: .Commit, start_line: .StartLine, end_line: .EndLine, fingerprint: .Fingerprint})' "$report" > /tmp/gitleaks-metadata-only.json
          {
            echo "## Ask Chatbot full-history secret scan"
            echo
            echo "- Scanned refs: all fetched branches and tags"
            echo "- Finding count: $(jq 'length' /tmp/gitleaks-metadata-only.json)"
            echo "- Secret values: omitted; report contains metadata only"
            echo
            echo "### Sanitized findings"
            cat /tmp/gitleaks-metadata-only.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/gitleaks-metadata-only.json
          if [ "$scan_status" -ne 0 ]; then
            echo "Secret findings remain; import gate stays blocked." >&2
            exit "$scan_status"
          fi
