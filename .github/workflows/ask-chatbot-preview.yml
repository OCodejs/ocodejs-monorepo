name: Ask OCode.js Preview CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ask-chatbot/**"
      - ".github/workflows/ask-chatbot-preview.yml"
      - "governance/migrations/ASK-CHATBOT-IMPORT-EXECUTION-AUDIT.md"
  push:
    branches:
      - "staging/ask-chatbot-*"
    paths:
      - "apps/ask-chatbot/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ask-chatbot-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test, lint and build (Preview only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Detect imported application
        id: app
        shell: bash
        run: |
          if [[ -f apps/ask-chatbot/package.json && -f apps/ask-chatbot/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ask OCode.js source is not imported yet; build checks are intentionally skipped."
          fi

      - name: Install locked dependencies
        if: steps.app.outputs.present == 'true'
        working-directory: apps/ask-chatbot
        run: npm ci --no-audit --no-fund

      - name: Run tests
        if: steps.app.outputs.present == 'true'
        working-directory: apps/ask-chatbot
        run: npm test

      - name: Run lint
        if: steps.app.outputs.present == 'true'
        working-directory: apps/ask-chatbot
        run: npm run lint

      - name: Build frontend
        if: steps.app.outputs.present == 'true'
        working-directory: apps/ask-chatbot
        run: npm run build

      - name: Report pending import
        if: steps.app.outputs.present != 'true'
        run: echo "Preview CI is installed. Import the source with Git history preserved to activate npm ci, tests, lint and build."
