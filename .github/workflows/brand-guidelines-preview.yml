name: Brand Guidelines Preview CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/brand-guidelines/**'
      - '.github/workflows/brand-guidelines-preview.yml'
  push:
    branches:
      - 'staging/import-code-zip-brand-guidelines'
    paths:
      - 'apps/brand-guidelines/**'
      - '.github/workflows/brand-guidelines-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-guidelines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brand-guidelines
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
